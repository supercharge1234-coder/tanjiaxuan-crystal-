<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiaxuan - Luxury Digital Card</title>
    
    <!-- Premium Fonts for a High-End Look -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container luxury-border">
        
        <!-- White & Gold Profile Header -->
        <div class="profile-header silk-bg">
            <div class="profile-row">
                <div class="avatar-container luxury-rim">
                    <!-- Placeholder image - Replace with your own later -->
                    <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=300&q=80" alt="Jiaxuan" class="avatar">
                </div>
                <div class="profile-info">
                    <p class="premium-greeting">Welcome</p>
                    <h1 class="name champ-gold-text">Jiaxuan</h1>
                    <p class="title">Luxury Collection</p>
                </div>
            </div>
            <!-- Refined 'Save' Button -->
            <a href="#" class="save-btn gold-button"><i class="fa-solid fa-plus"></i> ADD TO CONTACTS</a>
        </div>

        <!-- Sleek White & Gold Links -->
        <div class="links-list">
            
            <!-- WhatsApp -->
            <div class="link-item gold-ring">
                <div class="icon-box gold-icon"><i class="fa-brands fa-whatsapp"></i></div>
                <a href="https://wa.me/601155039920" class="capsule gold-hover-btn" target="_blank">
                    <span class="label gold-label">WhatsApp</span>
                    <span class="value dark-text">+6011-5503 9920</span>
                </a>
            </div>

            <!-- Instagram -->
            <div class="link-item gold-ring">
                <div class="icon-box gold-icon"><i class="fa-brands fa-instagram"></i></div>
                <a href="https://instagram.com/jjjiaxuannnn" class="capsule gold-hover-btn" target="_blank">
                    <span class="label gold-label">Instagram</span>
                    <span class="value dark-text">@jjjiaxuannnn</span>
                </a>
            </div>

            <!-- GitHub -->
            <div class="link-item gold-ring">
                <div class="icon-box gold-icon"><i class="fa-brands fa-github"></i></div>
                <a href="https://github.com/jjjiaxuannnn" class="capsule gold-hover-btn" target="_blank">
                    <span class="label gold-label">GitHub Portfolio</span>
                    <span class="value dark-text">jjjiaxuannnn</span>
                </a>
            </div>

        </div>

    </div>

</body>
</html>
